[project]
name = "turbosms-reporter"
version = "0.1.0"
description = "TurboSMS Report Generator desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "wxpython>=4.3.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

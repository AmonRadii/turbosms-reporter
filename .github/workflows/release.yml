name: Build and Release Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TurboSMS_Reporter_Windows
            asset_extension: zip
          - os: ubuntu-22.04
            artifact_name: TurboSMS_Reporter_Linux
            asset_extension: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer-plugins-base1.0-dev dpkg-dev

      - name: Install Python packages (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wxPython requests beautifulsoup4 lxml openpyxl

      - name: Install Python packages (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxPython
          pip install pyinstaller requests beautifulsoup4 lxml openpyxl

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="TurboSMS_Reporter" src/main.py

      
      - name: Prepare distribution folder
        shell: bash
        run: |
          cp search_templates.json dist/
          cp cookies.json dist/

      
      - name: Create Zip Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip

      
      - name: Create Tarball Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .

      
      - name: Create .deb Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi

          DEB_NAME="turbosms-reporter_${VERSION}_amd64"
          
          mkdir -p "${DEB_NAME}/DEBIAN"
          mkdir -p "${DEB_NAME}/opt/turbosms-reporter"
          mkdir -p "${DEB_NAME}/usr/bin"
          mkdir -p "${DEB_NAME}/usr/share/applications"

          cp dist/TurboSMS_Reporter "${DEB_NAME}/opt/turbosms-reporter/"
          cp dist/search_templates.json "${DEB_NAME}/opt/turbosms-reporter/"
          cp dist/cookies.json "${DEB_NAME}/opt/turbosms-reporter/"

          ln -s /opt/turbosms-reporter/TurboSMS_Reporter "${DEB_NAME}/usr/bin/turbosms-reporter"

          cat <<EOF > "${DEB_NAME}/usr/share/applications/turbosms-reporter.desktop"
          [Desktop Entry]
          Name=TurboSMS Reporter
          Comment=TurboSMS Report Generator
          Exec=/opt/turbosms-reporter/TurboSMS_Reporter
          Icon=utilities-terminal
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF

          cat <<EOF > "${DEB_NAME}/DEBIAN/control"
          Package: turbosms-reporter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: AmonRa
          Description: TurboSMS Report Generator desktop application
          EOF

          dpkg-deb --build "${DEB_NAME}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}.${{ matrix.asset_extension }}
            *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}